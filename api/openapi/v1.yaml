    post:
      tags: [test-tasks]
      operationId: createTestTask
      summary: 创建测试单（初始状态 wait）
      description: "`owner_id` 缺省取当前执行主体 ID。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestTaskRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestTask"
