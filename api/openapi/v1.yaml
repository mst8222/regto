    post:
      tags: [agent]
      operationId: createAgentSession
      summary: 登记 Agent 会话（人类专属）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentSessionRequest"
      responses:
        "201":
          description: 已登记的会话
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/agent/sessions/{agent_id}/revoke:
    post:
      tags: [agent]
      operationId: revokeAgentSession
      summary: 吊销 Agent 会话（人类专属，软删）
      parameters:
        - $ref: "#/components/parameters/AgentIDPath"
      responses:
        "204":
          description: 已吊销
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/roles:
    get:
      tags: [account]
      operationId: listRoles
      summary: 角色列表（5 个内置角色）
      responses:
        "200":
          description: 角色列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/roles/{code}/permissions:
    get:
      tags: [account]
      operationId: getRolePermissions
      summary: 某角色的权限矩阵（12 资源 × 4 动作 = 48 格）
      parameters:
        - $ref: "#/components/parameters/RoleCodePath"
      responses:
        "200":
          description: 角色及其权限格
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePermissions"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/users/{id}/permissions:
    get:
      tags: [account]
      operationId: getUserPermissions
      summary: 某用户的有效权限（本人或 admin 可查）
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
      responses:
        "200":
          description: 角色列表与权限并集（48 格）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPermissions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/users/{id}/roles:
    get:
      tags: [account]
      operationId: getUserRoles
      summary: 某用户的角色列表（本人或 admin 可查）
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
      responses:
        "200":
          description: 角色列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoles"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [account]
      operationId: bindUserRole
      summary: 绑定角色（admin 专属，幂等）
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindRoleRequest"
      responses:
        "201":
          description: 绑定后的角色列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRoles"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/users/{id}/roles/{role}/revoke:
    post:
      tags: [account]
      operationId: unbindUserRole
      summary: 解绑角色（admin 专属，软删；禁止解绑最后一个 admin）
      parameters:
        - $ref: "#/components/parameters/UserIDPath"
        - $ref: "#/components/parameters/RoleCodePath"
      responses:
        "204":
          description: 已解绑
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/reports:
    get:
      tags: [report]
      operationId: listReports
      summary: 可用报表清单（6 张固定报表）
      responses:
        "200":
          description: 报表清单（集合恒定在 data 键下）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReportMeta"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/reports/{id}:
    get:
      tags: [report]
      operationId: getReport
      summary: 执行单张报表（可选 product_id 过滤）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: product_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 报表结果（columns 为稳定列顺序，rows 为对象数组）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/audit/reports:
    get:
      tags: [audit]
      operationId: listAuditReports
      summary: 可用审计报表清单（3 张）
      description: 数据来自留痕（traces），可见性沿用 trace.view——访客看不到。
      responses:
        "200":
          description: 审计报表清单（集合恒定在 data 键下）
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditReportMeta"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/reports/{id}:
    get:
      tags: [audit]
      operationId: getAuditReport
      summary: 执行单张审计报表
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 审计报表结果（columns 为稳定列顺序，rows 为对象数组）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditReportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录或刷新获取的 access token，有效期 15 分钟。
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Regto-Api-Key
      description: AI Agent 长期凭据；明文仅创建时回显一次。

  parameters:
    UserIDPath:
      name: id
      in: path
      required: true
      description: 用户 ID（正整数）
      schema:
        type: integer
        format: int64
        minimum: 1
    RoleCodePath:
      name: code
      in: path
      required: true
      description: 角色 code（admin|pm|dev|qa|guest）
      schema:
        type: string
        enum: [admin, pm, dev, qa, guest]
    IDPath:
      name: id
      in: path
      required: true
      description: 资源 ID（正整数）
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      description: 页码，从 1 开始；非法值回落 1
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: 每页条数；缺省 50，上限 200
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      description: |
        排序字段，逗号分隔；前缀 `-` 降序、`+` 升序。
        允许字段：`created_at` `updated_at` `pri` `id` `title`。缺省 `-created_at`。
      schema:
        type: string
        example: "-pri,created_at"
    Keyword:
      name: keyword
      in: query
      description: 标题模糊匹配（LIKE，`%` 与 `_` 按字面量转义），最长 255
      schema:
        type: string
        maxLength: 255
    StatusFilter:
      name: status
      in: query
      description: 状态筛选，逗号分隔；非法值返回 400
      schema:
        type: string
        example: "active,reviewing"
    StageFilter:
      name: stage
      in: query
      description: 阶段筛选，逗号分隔；非法值返回 400
      schema:
        type: string
        example: "developing"
    TypeFilter:
      name: type
      in: query
      description: 需求类型筛选，逗号分隔
      schema:
        type: string
        example: "story,epic"
    ProductID:
      name: product_id
      in: query
      description: 按产品筛选
      schema:
        type: integer
        format: int64
        minimum: 1
    ModuleID:
      name: module_id
      in: query
      description: 按模块筛选
      schema:
        type: integer
        format: int64
        minimum: 1
    AssignedToID:
      name: assigned_to_id
      in: query
      description: 按负责人筛选
      schema:
        type: integer
        format: int64
        minimum: 1
    OpenedByID:
      name: opened_by_id
      in: query
      description: 按创建人筛选
      schema:
        type: integer
        format: int64
        minimum: 1
    IncludeDeleted:
      name: include_deleted
      in: query
      description: 是否纳入软删记录；仅 `true` 生效
      schema:
        type: string
        enum: ["true", "false"]
        default: "false"
    StoryID:
      name: story_id
      in: query
      description: 按关联需求筛选（用例）
      schema:
        type: integer
        format: int64
        minimum: 1
    ExternalID:
      name: external_id
      in: query
      description: 按 CI 侧标识筛选（如 go 测试函数名，精确匹配）
      schema:
        type: string
        maxLength: 255
    CaseSort:
      name: sort
      in: query
      description: |
        排序字段，逗号分隔；前缀 `-` 降序、`+` 升序。
        允许字段：`id` `title` `pri` `status` `type` `created_at` `updated_at`。缺省 `-created_at`。
      schema:
        type: string
        example: "-pri,id"
    CaseStatusFilter:
      name: status
      in: query
      description: 用例状态筛选（单值）；非法值返回 400
      schema:
        type: string
        enum: [wait, normal, blocked, investigate]
    CaseTypeFilter:
      name: type
      in: query
      description: 用例类型筛选（单值）；非法值返回 400
      schema:
        type: string
        enum: [feature, performance, config, install]
    TaskStatusFilter:
      name: status
      in: query
      description: 测试单状态筛选（单值）；非法值返回 400
      schema:
        type: string
        enum: [wait, doing, done, blocked]
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 乐观锁版本号（用例当前 version）；不匹配返回 412
      schema:
        type: integer

    TraceIDPath:
      name: trace_id
      in: path
      required: true
      description: 留痕 ID（26 位 ULID）
      schema:
        type: string
        minLength: 26
        maxLength: 26
    AgentIDPath:
      name: agent_id
      in: path
      required: true
      description: Agent 标识（≤64 字符）
      schema:
        type: string
        maxLength: 64

  responses:
    Forbidden:
      description: 主体无权执行该动作（human_only 档动作，AI 专属边界）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: 请求格式错误（非法 JSON、未知字段、非法查询参数）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: 缺失或无效凭据
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: 资源不存在
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: 并发冲突（乐观锁版本不匹配）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: 业务规则拒绝（非法状态转移 / 阶段回退 / 参数越界语义）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: 乐观锁版本不匹配（If-Match 与当前 version 不一致）
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:

    Problem:
      type: object
      description: RFC 7807 错误体
      properties:
        type:
          type: string
          format: uri
          example: "https://regto.local/errors/INVALID_TRANSITION"
        title:
          type: string
          example: Unprocessable Entity
        status:
          type: integer
          example: 422
        detail:
          type: string
          description: 5xx 时统一回显 "internal error"，不泄漏内部细节
        code:
          type: string
          example: INVALID_TRANSITION
        meta:
          type: object
          additionalProperties: true
          description: 结构化补充信息（如 allowed / from / to / field）
        request_id:
          type: string
      required: [type, title, status, detail]

    # ---------- auth ----------

    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        account:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required: [account, password]

    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 1
      required: [refresh_token]

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: access token 剩余秒数
          example: 900
        subject:
          $ref: "#/components/schemas/Subject"
      required: [access_token, refresh_token, token_type, expires_in, subject]

    MeResponse:
      type: object
      description: 当前会话主体及其角色（角色只供前端菜单粗筛，不是判定依据）
      properties:
        subject:
          $ref: "#/components/schemas/Subject"
        roles:
          type: array
          description: 角色码；API Key / AI 主体为空数组
          items:
            type: string
          example: [developer]
      required: [subject, roles]

    Subject:
      type: object
      description: 执行主体（human / ai / system）
      properties:
        kind:
          type: string
          enum: [human, ai, system]
        id:
          type: integer
          format: int64
        account:
          type: string
        agent_id:
          type: string
          description: AI Agent 标识（kind=ai 时非空）
      required: [kind, id]

    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        subject_kind:
          type: string
          enum: [human, ai]
          description: 缺省按 agent_id 推断
        subject_id:
          type: integer
          format: int64
          description: 缺省绑定创建者本人
        agent_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        ttl_days:
          type: integer
          minimum: 0
          description: 有效天数；0 表示永不过期
      required: [name]

    APIKey:
      type: object
      properties:
        id:
          type: integer
          format: int64
        key:
          type: string
          description: 明文密钥；仅创建响应返回一次
        key_prefix:
          type: string
          description: 可安全展示/记录的前缀
        name:
          type: string
        subject_kind:
          type: string
          enum: [human, ai]
        subject_id:
          type: integer
          format: int64
        agent_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, revoked]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required: [id, key_prefix, name, subject_kind, subject_id, status, created_at]

    # ---------- story ----------

    CreateStoryRequest:
      type: object
      additionalProperties: false
      properties:
        product_id:
          type: integer
          format: int64
          minimum: 1
        module_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 255
        type:
          type: string
          enum: [story, requirement, epic]
          default: story
        pri:
          type: integer
          minimum: 0
        estimate:
          type: number
          nullable: true
        spec:
          type: string
        verify:
          type: string
        reviewers:
          type: array
          items:
            type: integer
            format: int64
        source_note:
          type: string
        as_draft:
          type: boolean
          description: true 时以草稿态创建，并把 reviewers 作为预设评审人
      required: [product_id, title]

    SpecInput:
      type: object
      additionalProperties: false
      description: 变更动作使用的规格输入（缺省字段不覆盖原值）
      properties:
        title:
          type: string
          maxLength: 255
        spec:
          type: string
        verify:
          type: string
        pri:
          type: integer
          minimum: 0
        estimate:
          type: number
          nullable: true

    TransitionRequest:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
            - create
            - submitReview
            - reviewPass
            - reviewClarify
            - reviewRevert
            - reviewReject
            - change
            - activate
            - close
        spec:
          $ref: "#/components/schemas/SpecInput"
        close_reason:
          type: string
          enum: [done, subdivided, duplicate, postponed, willnotdo, cancel, bydesign]
          description: close 动作必填
        review_results:
          type: array
          items:
            type: string
            enum: [pass, clarify, revert, reject]
          description: 多人评审结果，按聚合规则收敛
        reviewers:
          type: array
          items:
            type: integer
            format: int64
        comment:
          type: string
        reviewer_id:
          type: integer
          format: int64
          description: 缺省取当前执行主体 ID
      required: [action]

    AdvanceStageRequest:
      type: object
      additionalProperties: false
      properties:
        stage:
          type: string
          enum:
            - wait
            - planned
            - projected
            - developing
            - developed
            - testing
            - tested
            - released
      required: [stage]

    SpecVersion:
      type: object
      properties:
        version:
          type: integer
        title:
          type: string
        spec:
          type: string
        verify:
          type: string
      required: [version, title]

    Story:
      type: object
      properties:
        id:
          type: integer
          format: int64
        product_id:
          type: integer
          format: int64
        module_id:
          type: integer
          format: int64
          nullable: true
        title:
          type: string
        type:
          type: string
          enum: [story, requirement, epic]
        pri:
          type: integer
        estimate:
          type: number
          nullable: true
        status:
          type: string
          enum: [draft, reviewing, active, changing, closed]
        stage:
          type: string
          enum: [wait, planned, projected, developing, developed, testing, tested, released]
        spec_version:
          type: integer
          description: 当前规格版本号，从 1 开始
        closed_reason:
          type: string
          enum: ["", done, subdivided, duplicate, postponed, willnotdo, cancel, bydesign, reviewrejected]
        reviewers:
          type: array
          items:
            type: integer
            format: int64
        opened_by_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        current_spec:
          $ref: "#/components/schemas/SpecVersion"
      required:
        [id, product_id, title, type, pri, status, stage, spec_version, opened_by_id, created_at, updated_at]

    StoryListItem:
      type: object
      description: 列表投影；不含规格版本链（避免 N+1，DEC-04）
      properties:
        id:
          type: integer
          format: int64
        product_id:
          type: integer
          format: int64
        module_id:
          type: integer
          format: int64
          nullable: true
        title:
          type: string
        type:
          type: string
          enum: [story, requirement, epic]
        pri:
          type: integer
        status:
          type: string
          enum: [draft, reviewing, active, changing, closed]
        stage:
          type: string
          enum: [wait, planned, projected, developing, developed, testing, tested, released]
        spec_version:
          type: integer
        closed_reason:
          type: string
        assigned_to_id:
          type: integer
          format: int64
          nullable: true
        opened_by_id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted:
