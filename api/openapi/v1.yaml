    get:
      tags: [test-tasks]
      operationId: getTestTask
      summary: 测试单详情
      parameters:
        - $ref: "#/components/parameters/IDPath"
      responses:
        "200":
          description: 测试单详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/test-tasks/{id}/transitions:
    post:
      tags: [test-tasks]
      operationId: transitionTestTask
      summary: 测试单状态转移统一入口
      description: |
        四态状态机：`wait → doing ⇄ blocked`，`done` 为终态（REQ-01）。
        导入结果时测试单不在 `doing` 会**自动 start**（导入即开始执行）。

        | action | 语义 |
        |---|---|
        | `start` | wait/blocked → doing |
        | `finish` | doing/blocked → done |
        | `block` | wait/doing → blocked |
      parameters:
        - $ref: "#/components/parameters/IDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestTaskTransitionRequest"
      responses:
        "200":
          description: 转移成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/test-tasks/{id}/cases:
    get:
      tags: [test-tasks]
      operationId: listTestTaskCases
      summary: 测试单内的用例及执行状态
      parameters:
        - $ref: "#/components/parameters/IDPath"
      responses:
        "200":
          description: 用例列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCaseList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [test-tasks]
      operationId: addTestTaskCases
      summary: 把用例加入测试单（锁定当前版本快照）
      parameters:
        - $ref: "#/components/parameters/IDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCasesRequest"
      responses:
        "201":
          description: 加入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  added:
                    type: integer
                    description: 实际新增数（已存在的不重复计）
                required: [added]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/test-tasks/{id}/import-result:
    post:
      tags: [test-tasks]
      operationId: importTestResult
      summary: 导入 go test -json 执行结果（REQ-04~07）
      description: |
        事件流按 `Package + "/" + Test` 聚合（REQ-04.5：同一 Test 的多次结论后者覆盖；
        剔除包级事件）。按 `product_id + external_id`（如 go 测试函数名）匹配用例；
        未匹配且未开 `create_missing` 时返回 400 `UNMATCHED_TESTS`
        （`meta.unmatched` 列出全部未匹配名，默认失败不留「以为导入了」的空间）。
        测试单不在 `doing` 时自动 start。`run_no` 缺省取已有最大 + 1（DEC-07），
        显式传值可复现（同一 job 重传同一 run_no → 覆盖）。
      parameters:
        - $ref: "#/components/parameters/IDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportResultRequest"
      responses:
        "201":
          description: 导入完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResultResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

