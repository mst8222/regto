        agent_id:
          type: string
          minLength: 1
          maxLength: 64
        display_name:
          type: string
          maxLength: 128
        model:
          type: string
        capabilities:
          type: array
          items:
            type: string
        approval_policy:
          type: object
          additionalProperties:
            type: string
            enum: [auto, approval, human_only]
        owner_id:
          type: integer
          format: int64
        expires_at_ms:
          type: integer
          format: int64
      required: [agent_id, capabilities]

    Role:
      type: object
      properties:
        code:
          type: string
          enum: [admin, pm, dev, qa, guest]
        name:
          type: string
        description:
          type: string
        builtin:
          type: boolean
      required: [code, name, builtin]

    Permission:
      type: object
      description: 矩阵的一格。只给结论，不带理由——单格没有判定上下文。
      properties:
        resource:
          type: string
          enum: [product, project, story, case, suite, testtask, plan, release, build, spec, trace, agent]
        action:
          type: string
          enum: [view, create, edit, delete]
        allowed:
          type: boolean
      required: [resource, action, allowed]

    RolePermissions:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
      required: [role, permissions]

    UserPermissions:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          description: 多角色权限的并集（48 格，拒绝项也在，allowed=false）
          items:
            $ref: "#/components/schemas/Permission"
      required: [user_id, roles, permissions]

    UserRoles:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        roles:
          type: array
          items:
            type: string
      required: [user_id, roles]

    ReportMeta:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        scoped:
          type: boolean
          description: 是否支持 product_id 过滤
      required: [id, title, description, category, scoped]

    AuditReportMeta:
      type: object
      required: [id, title, description, category]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
    AuditReportResponse:
      type: object
      required: [id, title, generated_at, columns, rows]
      properties:
        id:
          type: string
        title:
          type: string
        generated_at:
          type: string
          format: date-time
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
    ReportResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        generated_at:
          type: string
          format: date-time
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [id, title, generated_at, columns, rows]
    BindRoleRequest:
      type: object
      properties:
        role:
          type: string
          enum: [admin, pm, dev, qa, guest]
      required: [role]
