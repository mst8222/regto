openapi: 3.1.0

# Regto API v1 契约（唯一真源）
#
# 纪律（AGENTS.md §5 / ROADMAP §3.4）：
#   1. 本文件是接口契约的唯一真源，新增/修改路由必须先改这里，再改代码；
#   2. tests/unit/openapi 会在 CI 中校验「契约路径 ⊆ 路由树」且「路由树 ⊆ 契约路径」，
#      二者不一致直接红灯——防止契约先腐化；
#   3. 本文件不生成代码（oapi-codegen 属 P1 后续项），仅用于文档与契约校验。

info:
  title: Regto API
  version: 1.0.0
  summary: 绳直（Regto）项目协作开发管理 API
  description: |
    Regto 是面向「人类 + AI Agent」双主体的项目协作开发管理系统，
    核心是 SpecDD（规格驱动开发）：需求、设计、测试三份规格文档联动，
    所有变更留痕进 hash 链。

    ## 约定
    - 基路径 `/api/v1`，资源名复数。
    - 时间统一 **RFC3339 UTC**；领域内部存 unix 毫秒，出口转换。
    - 集合恒定包裹在 `data` 键下，分页信息在 `page`，导航在 `links`。
    - 错误统一 **RFC 7807** `application/problem+json`。
    - 业务规则拒绝（非法状态转移、阶段回退等）统一 **422**；
      请求格式问题（非法 JSON、非法查询参数）为 **400**。

    ## 认证
    除 `/healthz`、`/readyz`、登录与刷新外，全部接口需要凭据：
    - `Authorization: Bearer <JWT>`（人类 / AI 会话令牌，15 分钟有效）
    - `X-Regto-Api-Key: <key>`（AI Agent 长期凭据，创建时仅回显一次）

    ## 执行主体
    主体的 `kind` 取值 `human` / `ai` / `system`，写进每一次变更的 activities 与留痕链。
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: 本地开发

tags:
  - name: system
    description: 健康与就绪探针
  - name: auth
    description: 认证与凭据管理
  - name: stories
    description: 需求（Story）域
  - name: cases
    description: 测试用例域（用例/步骤/套件与 ZTF 导入导出）
  - name: test-tasks
    description: 测试执行域（测试单/执行结果）
  - name: plans
    description: 产品计划域（plan/plan_stories）
  - name: releases
    description: 发布域（release）
  - name: builds
    description: 构建域（build，记录型实体无状态机）

security:
  - bearerAuth: []
  - apiKeyAuth: []

paths:
  /healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: 进程存活探针
      description: 不依赖任何外部组件，仅证明进程在跑。
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]

  /readyz:
    get:
      tags: [system]
      operationId: readyz
      summary: 就绪探针
      description: 校验 PostgreSQL（必选）与 Redis（未启用时值为 disabled）连通性。
      security: []
      responses:
        "200":
          description: 全部依赖可用
          content:
            application/json:
              schema:
                type: object
                properties:
                  postgres:
                    type: string
                    enum: [ok]
                  redis:
                    type: string
                    enum: [ok, disabled]
                required: [postgres]
        "503":
          description: 依赖不可用
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 账号密码登录换取令牌对
      description: |
        成功时除响应体外，还下发 `Set-Cookie: regto_refresh`（`HttpOnly; SameSite=Lax;
        Path=/api/v1/auth`，Max-Age 与 refresh 有效期一致）。
        浏览器客户端只读 `access_token`，refresh 走 cookie；SDK / CLI 用响应体里的
        `refresh_token`（兼容保留）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: 用 refresh token 换新令牌对
      description: |
        刷新令牌**单次有效**（REQ-02）：用后立即失效，重放同一令牌返回 401 并连坐撤销整个 family。

        令牌来源优先级 **cookie > 请求体**：浏览器带 `regto_refresh` cookie 即可，
        请求体可省略；SDK / CLI 没有 cookie，用请求体传 `refresh_token`。
        来源为 cookie 时响应会回写新的 `Set-Cookie`（轮换），来源为请求体时不回写。

        拦截浏览器跨站请求：`Origin` 存在且既非同源、也不在
        `REGTO_WEB_ALLOWED_ORIGINS` 白名单内时返回 403 `ORIGIN_NOT_ALLOWED`。
        不带 `Origin` 的请求（curl / SDK）一律放行。
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 登出并撤销当前会话的 refresh family
      description: |
        撤销 cookie（或请求体）里 refresh token 所属的**整个 family**，并清除 cookie。
        幂等：令牌缺失、已过期、已撤销都返回 204——登出的语义是「确保这个会话不再能续期」，
        对已失效的会话报错只会让前端在续期竞态里吞错误。

        只影响当前设备：其他设备的会话不受影响。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: 已登出（无论此前会话是否仍然有效）
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: 当前会话主体与角色
      description: |
        返回调用者自身的主体信息与角色码。`roles` **仅供前端菜单粗筛**（REQ-07），
        不是权限判定依据——后端 ACLGuard 才是唯一判定源。
        API Key / AI 主体调用时 `roles` 为空数组。
      responses:
        "200":
          description: 当前主体
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/auth/embed-token:
    post:
      tags: [auth]
      operationId: embedToken
      summary: 为当前主体签发一枚短 TTL 嵌入令牌（mo-mind 嵌入位）
      description: |
        签的是**调用者自己**，权限与调用者原有的一致，不产生任何提权
        （DESIGN-WEB-001#DEC-14）。保护来自两处：TTL 默认 5 分钟（上限 30 分钟），
        以及传输通道——前端必须经 postMessage 交给 iframe，
        **绝不能放进 URL query**（URL 会落到 referer、访问日志与浏览器历史）。
        校验方式与 access token 完全一致，mo-mind 侧无需新的验签逻辑。
      responses:
        "200":
          description: 嵌入令牌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/v1/auth/api-keys:
    post:
      tags: [auth]
      operationId: createAPIKey
      summary: 创建 API Key
      description: |
        明文密钥**仅在创建响应中返回一次**（REQ-03），服务端只存 SHA-256 摘要。
        `subject_kind` 缺省时按是否带 `agent_id` 推断：带则 `ai`，不带则 `human`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: 创建成功（含一次性明文）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/auth/api-keys/{id}:
    delete:
      tags: [auth]
      operationId: revokeAPIKey
      summary: 吊销 API Key
      description: 软吊销（状态置 revoked），不物理删除——审计要求（NFR-03）。
      parameters:
        - $ref: "#/components/parameters/IDPath"
      responses:
        "204":
          description: 已吊销
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/stories:
    get:
      tags: [stories]
      operationId: listStories
      summary: 需求列表（分页 / 筛选 / 排序）
      description: |
        - 默认排序 `-created_at`；可多字段排序，如 `sort=-pri,created_at`。
        - 越界分页参数**截断**到允许范围（1–200），非法枚举**拒绝**返回 400。
        - 默认排除软删记录，`include_deleted=true` 时纳入并在行上返回 `deleted: true`。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/StageFilter"
        - $ref: "#/components/parameters/TypeFilter"
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/ModuleID"
        - $ref: "#/components/parameters/AssignedToID"
        - $ref: "#/components/parameters/OpenedByID"
        - $ref: "#/components/parameters/IncludeDeleted"
      responses:
        "200":
          description: 列表（空结果时 data 为 []，不为 null）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

    post:
      tags: [stories]
      operationId: createStory
      summary: 创建需求
      description: |
        `as_draft=true` 时以草稿态创建并**显式**把 `reviewers` 作为预设评审人（DEC-10），
        优先级高于产品/模块默认评审人。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoryRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/stories/{id}:
    get:
      tags: [stories]
      operationId: getStory
      summary: 需求详情
      description: 含当前规格版本（`current_spec`）快照。
      parameters:
        - $ref: "#/components/parameters/IDPath"
      responses:
        "200":
          description: 需求详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/stories/{id}/transitions:
    post:
      tags: [stories]
      operationId: transitionStory
      summary: 状态转移统一入口
      description: |
        所有状态变更走此单一入口（ROADMAP §3.4 关键差异 1），
        非法转移返回 **422** 且 `meta.allowed` 列出当前状态允许的合法动作。

        | action | 语义 |
        |---|---|
        | `create` | 草稿 → 激活（跳过评审） |
        | `submitReview` | 提交评审：草稿/变更中 → 评审中 |
        | `reviewPass` | 评审通过 → 激活 |
        | `reviewClarify` | 评审待澄清 → 回到前一状态 |
        | `reviewRevert` | 评审回退版本 → 规格版本 -1 |
        | `reviewReject` | 评审拒绝 → 关闭（reason=reviewrejected） |
        | `change` | 激活 → 变更中（产生新规格版本） |
        | `activate` | 变更中 → 激活 |
        | `close` | 关闭（需 close_reason） |

        评审结果经 `review_results` 聚合（DEC-09）：与需求同事务落库，
        非法评审不会留下孤立单据。
      parameters:
        - $ref: "#/components/parameters/IDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
      responses:
        "200":
          description: 转移成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/stories/{id}/stage:
    post:
      tags: [stories]
      operationId: advanceStage
      summary: 推进研发阶段
      description: |
        可跳级、**不可回退**、不可原地踏步（REQ-06）。
        回退或原地推进返回 422，并带 `meta.from` / `meta.to`。
      parameters:
        - $ref: "#/components/parameters/IDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceStageRequest"
      responses:
        "200":
          description: 推进成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  # ---------- 用例域（SPEC-CASE-001） ----------

  /api/v1/cases:
    get:
      tags: [cases]
      operationId: listCases
      summary: 用例列表（分页 / 筛选 / 排序）
      description: |
        排序允许字段：`id` `title` `pri` `status` `type` `created_at` `updated_at`，
        缺省 `-created_at`。`status`/`type` 为**单值**枚举筛选（与 story 的逗号分隔不同），
        非法值返回 400。空结果 `data` 为 `[]`。
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/CaseSort"
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/CaseStatusFilter"
        - $ref: "#/components/parameters/CaseTypeFilter"
        - $ref: "#/components/parameters/ProductID"
        - $ref: "#/components/parameters/ModuleID"
        - $ref: "#/components/parameters/StoryID"
        - $ref: "#/components/parameters/ExternalID"
      responses:
        "200":
          description: 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

    post:
      tags: [cases]
      operationId: createCase
      summary: 创建用例（初始状态 wait）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCaseRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/cases/import-ztf:
    post:
      tags: [cases]
      operationId: importCasesZTF
      summary: 从 ZTF 文本批量导入用例（REQ-05）
      description: |
        ZTF 规范形式见 DESIGN-CASE-001：`>>>` 标题行（标题 = 首个 `@` 属性前的全部文本，
        可含空格）、`***` 步骤、`>>` 检查点、`**` 分组步骤；空行分隔用例块。
        语法错误返回 400 `INVALID_ZTF` 且 `meta.line` 指出首个错误行（AC-03）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportZTFRequest"
      responses:
        "201":
          description: 导入完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportZTFResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /api/v1/cases/{id}:
    get:
      tags: [cases]
      operationId: getCase
      summary: 用例详情（含步骤）
      parameters:
        - $ref: "#/components/parameters/IDPath"
      responses:
        "200":
          description: 用例详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [cases]
      operationId: updateCase
      summary: 修改用例主数据（不动步骤）
      description: 全字段可选，空值不覆盖原值；并发修改由乐观锁拦截（412）。
      parameters:
        - $ref: "#/components/parameters/IDPath"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaseRequest"
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/cases/{id}/transitions:
    post:
      tags: [cases]
      operationId: transitionCase
      summary: 用例状态转移统一入口
      description: |
        四态状态机：`wait → normal → blocked ⇄ investigate`（REQ-04）。
        非法转移返回 422 且 `meta.allowed` 列出合法动作（AC-02）。

        | action | 语义 |
        |---|---|
        | `activate` | wait → normal |
        | `block` | normal/investigate → blocked |
        | `investigate` | normal/blocked → investigate |
        | `resume` | blocked/investigate → normal |
      parameters:
        - $ref: "#/components/parameters/IDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaseTransitionRequest"
      responses:
        "200":
          description: 转移成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/cases/{id}/export-ztf:
    get:
      tags: [cases]
      operationId: exportCaseZTF
      summary: 导出用例为 ZTF 文本（REQ-06）
      description: |
        `text/plain; charset=utf-8`。导出为规范形式（UTF-8、LF、单换行结束），
        round-trip 逐字节一致（AC-01）。
      parameters:
        - $ref: "#/components/parameters/IDPath"
      responses:
        "200":
          description: ZTF 文本
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------- 套件（REQ-03） ----------

  /api/v1/suites:
    post:
      tags: [cases]
      operationId: createSuite
      summary: 创建用例套件（同产品下同名唯一）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSuiteRequest"
      responses:
        "201":
